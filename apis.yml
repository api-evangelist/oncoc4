aid: oncoc4
name: OncoC4
description: 'OncoC4, Inc. is a privately held, late clinical-stage biopharmaceutical
  company headquartered in Rockville, Maryland, founded in 2020, with subsidiaries
  in Nanjing, Guangzhou and Beijing, China, and Brisbane, Australia. The company discovers
  and develops novel biologics for the treatment of cancer, working across immune
  checkpoints including CTLA-4, CD24, PD-1/VEGF and the Siglec family, with monoclonal
  antibodies, bispecific antibodies, antibody-drug conjugates and CAR T-cell therapies.
  Its lead clinical candidate is gotistobart (BNT316/ONC-392), a next-generation
  anti-CTLA-4 antibody co-developed and commercialized with BioNTech under a strategic
  collaboration announced in March 2023. OncoC4 publishes no developer program, public
  API, SDK or developer documentation; its corporate website runs on the Umbraco CMS,
  which serves a default OpenID Connect / OAuth 2.0 discovery document and JWKS for
  CMS member authentication.'
